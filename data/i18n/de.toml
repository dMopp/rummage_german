"The extractor was interrupted before completion. Retry if you did not intend to cancel extraction." = "Das Entpackprogramm wurde vor dem Ende unterbrochen. Erneut versuchen, falls das Entpacken nicht abgebrochen werden sollte."
"The extractor ran out of memory. Close other applications or use a machine with more available memory." = "Dem Entpackprogramm ist der Speicher ausgegangen. Andere Anwendungen schließen oder einen Rechner mit mehr freiem Speicher nutzen."
"The extractor could not complete the operation. Check the details below, the archive's integrity, and destination permissions; then retry or use another extractor." = "Das Entpackprogramm konnte den Vorgang nicht abschließen. Die Details unten, die Unversehrtheit des Archivs und die Zielrechte prüfen; dann erneut versuchen oder ein anderes Entpackprogramm nutzen."

